- q: "Est-ce vraiment gratuit ?"
  r: "Oui. Il n'y a ni compte, ni abonnement, ni publicité. L'outil tourne entièrement dans votre navigateur, ce qui ne coûte presque rien à faire fonctionner."
- q: "Mes données sont-elles envoyées quelque part ?"
  r: "Non. **Aucune donnée n'est envoyée sur un serveur.** Les informations du bail sont rangées dans le lien de votre rappel, après le signe « # ». Cette partie d'une adresse web reste dans votre navigateur : elle n'est jamais transmise au site. Le PDF est fabriqué sur votre appareil."
- q: "Comment ça marche, chaque mois ?"
  r: "Le jour du loyer, votre agenda vous envoie un rappel. Quand le paiement est bien arrivé, cliquez sur le lien du rappel : la quittance du mois s'ouvre, déjà remplie. Vérifiez, téléchargez le PDF, envoyez-le au locataire."
- q: "Le locataire n'a payé qu'une partie du loyer : que faire ?"
  r: "Choisissez « En partie : reçu ». Une quittance atteste d'un paiement **intégral** du loyer et des charges ; en cas de paiement partiel, le bailleur délivre un reçu qui indique la somme versée et le reste dû."
- q: "Le loyer a été révisé (IRL) : dois-je tout refaire ?"
  r: "Non. Dans la page de la quittance, le montant se corrige d'un clic. Pour que les prochains rappels affichent le nouveau montant, utilisez le lien « mettre à jour votre agenda » et importez le nouveau fichier (en supprimant les anciens rappels)."
- q: "Puis-je envoyer la quittance par e-mail ?"
  r: "Oui, avec l'accord du locataire. Le bouton « Écrire l'e-mail » prépare l'objet et le message ; joignez-y le PDF téléchargé. Sur téléphone, le bouton « Partager » envoie directement le PDF par e-mail ou messagerie quand votre appareil le permet."
- q: "Fonctionne-t-il avec Google Agenda, iPhone et Outlook ?"
  r: "Oui, le fichier .ics est un format standard. Attention : Google Agenda remplace les rappels du fichier par ses notifications par défaut lors d'un import."
- q: "La quittance a-t-elle une valeur légale ?"
  r: "Le document reprend les mentions attendues : bailleur, locataire, adresse du logement, période, détail du loyer et des charges, date du paiement, gratuité. Il reste de votre responsabilité de vérifier les informations avant de le remettre."
